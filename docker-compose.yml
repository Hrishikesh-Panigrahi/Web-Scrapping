version: '3.8'

services:
  web-crawler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - PORT=8080
      - CSV_PATH=/app/data/products.csv
      - LOG_LEVEL=info
      - RATE_LIMIT_RPM=10
      - REQUEST_TIMEOUT=60
    volumes:
      - crawler_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/main", "-health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-crawler
    restart: unless-stopped
    profiles:
      - production

volumes:
  crawler_data:
    driver: local

networks:
  default:
    driver: bridge
